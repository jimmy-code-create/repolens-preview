<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RepoLens self-test</title>
<style>
  body { font: 15px/1.5 ui-monospace, monospace; background: #111; color: #eee; margin: 0; padding: 16px; }
  #frame { width: 390px; height: 844px; border: 1px solid #444; }
  .pass { color: #7ee787; } .fail { color: #ff7b72; } .info { color: #9aa4b2; }
</style>
</head>
<body>
<h1>RepoLens self-test</h1>
<iframe id="frame" src="index.html" title="page under test"></iframe>
<pre id="out">running…</pre>
<script>
const out = document.getElementById('out');
const lines = [];
let pass = 0, fail = 0;
const log = (ok, name, detail) => {
  pass += ok ? 1 : 0;
  fail += ok ? 0 : 1;
  lines.push((ok ? 'PASS ' : 'FAIL ') + name + (detail ? ' — ' + detail : ''));
  out.textContent = lines.join('\n');
  out.dataset.done = String(fail === 0 ? 'all-pass' : 'has-failures');
};
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const frame = document.getElementById('frame');

frame.addEventListener('load', async () => {
  const win = frame.contentWindow;
  const doc = frame.contentDocument;
  const errors = [];
  win.addEventListener('error', (e) => errors.push(String(e.message)));
  await sleep(300);

  log(doc.title.length > 10, 'title', doc.title);
  log(doc.documentElement.lang === 'en', 'lang', doc.documentElement.lang);
  const h1 = doc.querySelector('h1');
  log(!!h1 && h1.textContent.replace(/\s+/g, ' ').trim() === 'Your repo already knows what to build next.', 'h1 exact', h1 ? h1.textContent.trim() : 'missing');
  log(doc.querySelectorAll('article.feature').length === 6, 'six features', String(doc.querySelectorAll('article.feature').length));
  log(doc.querySelectorAll('.pattern__frame').length === 3, 'three phone sketches', String(doc.querySelectorAll('.pattern__frame').length));
  log(doc.querySelectorAll('[data-copy-target]').length === 2, 'two prompt boxes');
  log(doc.querySelectorAll('[data-copy-target][hidden]').length === 0, 'copy buttons revealed');
  log(!!doc.querySelector('dialog#early-access'), 'dialog present');

  const overflow = () => doc.documentElement.scrollWidth - doc.documentElement.clientWidth;
  log(overflow() <= 1, 'no h-scroll at 390', overflow() + 'px');
  frame.style.width = '360px';
  await sleep(250);
  log(overflow() <= 1, 'no h-scroll at 360', overflow() + 'px');
  frame.style.width = '390px';
  await sleep(250);

  const rail = doc.querySelector('.patterns');
  if (rail) log(rail.scrollWidth > rail.clientWidth, 'phone rail scrolls sideways', rail.scrollWidth + '>' + rail.clientWidth);

  const terminal = doc.querySelector('.terminal');
  win.scrollTo(0, terminal.getBoundingClientRect().top + win.scrollY - 80);
  await sleep(500);
  log(terminal.getAttribute('data-live') === 'true', 'terminal goes live in view');
  const cmd = terminal.querySelector('[data-command]');
  await sleep(2600);
  const typed = cmd.textContent.trim();
  log(typed.length > 5 && typed.length < 38, 'command types', JSON.stringify(typed.slice(0, 24)));
  await sleep(5000);
  const shown = terminal.querySelectorAll('.finding.is-shown').length;
  log(shown === 6, 'six findings revealed', String(shown));
  log(cmd.textContent.trim() === 'repolens scan github.com/you/chat-app', 'full command', JSON.stringify(cmd.textContent.trim()));

  const pause = terminal.querySelector('.terminal__pause');
  pause.click();
  log(terminal.getAttribute('data-paused') === 'true' && pause.textContent === 'Resume', 'pause works', pause.textContent);
  pause.click();
  log(terminal.getAttribute('data-paused') === 'false' && pause.textContent === 'Pause', 'resume works', pause.textContent);

  const copyBtn = doc.querySelector('[data-copy-target]');
  copyBtn.click();
  await sleep(700);
  log(copyBtn.getAttribute('data-copied') === 'true' || copyBtn.textContent === 'Copied', 'copy gives feedback', copyBtn.textContent);
  const status = doc.getElementById('copy-status').textContent;
  log(status.length > 0, 'copy announced', status);

  const trigger = doc.getElementById('early-access');
  trigger.click();
  await sleep(200);
  const dialog = doc.getElementById('early-access');
  log(dialog.open === true, 'dialog opens');
  log(dialog.contains(doc.activeElement), 'focus moves into dialog', doc.activeElement && doc.activeElement.id);

  const form = dialog.querySelector('form');
  const email = dialog.querySelector('#email');
  const error = dialog.querySelector('#email-error');
  form.requestSubmit();
  await sleep(150);
  log(!error.hidden && error.textContent.length > 0, 'empty submit shows error', error.textContent);
  email.value = 'nope';
  form.requestSubmit();
  await sleep(150);
  log(!error.hidden && /name@example\.com/.test(error.textContent), 'bad email rejected', error.textContent);
  email.value = 'you@example.com';
  form.requestSubmit();
  await sleep(150);
  const success = doc.getElementById('dialog-success');
  log(!success.hidden && /Nothing was sent/.test(success.textContent), 'valid email confirms honestly', success.textContent);
  log(dialog.open === true, 'dialog stays open after submit');

  dialog.querySelector('[data-close-dialog]').click();
  await sleep(200);
  log(dialog.open === false, 'dialog closes');
  log(doc.activeElement === trigger, 'focus returns to trigger', doc.activeElement && doc.activeElement.textContent.trim());

  log(errors.length === 0, 'no runtime errors', errors.join('; '));
  lines.push('RESULT ' + pass + ' passed, ' + fail + ' failed');
  out.textContent = lines.join('\n');
  out.dataset.done = String(fail === 0 ? 'all-pass' : 'has-failures');
  document.title = (fail === 0 ? 'ALL PASS ' : 'FAILURES ' + fail + ' ') + pass + '/' + (pass + fail);
});
</script>
</body>
</html>
